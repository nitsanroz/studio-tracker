<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Board columns named In design and Client approval, with a task card being dragged between them">
  <!-- Real text in the cards, not grey bars: the point is that the COLUMNS are
       the studio's own statuses, and a column of placeholder rules can't say
       that. Card recipe is the app's: rounded-2xl + border-border + shadow-card
       outside, rounded-xl on bg-background (#f0f1fa) inside. -->
  <defs>
    <filter id="bdCard" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.10"/>
    </filter>
    <filter id="bdLift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#06112f" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- In design -->
  <g filter="url(#bdCard)">
    <rect x="6" y="12" width="164" height="220" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="22" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06112f">In design</text>
  <rect x="96" y="27" width="20" height="15" rx="7.5" fill="#e8edfd"/>
  <text x="102" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d32c8">4</text>

  <rect x="20" y="122" width="136" height="46" rx="12" fill="#f0f1fa"/>
  <text x="32" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06112f">Brand guidelines</text>
  <circle cx="36" cy="154" r="4" fill="#d4537e"/>
  <text x="45" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Checkmarx</text>

  <rect x="20" y="176" width="136" height="46" rx="12" fill="#f0f1fa"/>
  <text x="32" y="194" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06112f">LinkedIn banners</text>
  <circle cx="36" cy="208" r="4" fill="#1d9e75"/>
  <text x="45" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">No Traffic</text>

  <!-- Client approval -->
  <g filter="url(#bdCard)">
    <rect x="184" y="12" width="164" height="220" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="200" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06112f">Client approval</text>
  <rect x="292" y="27" width="20" height="15" rx="7.5" fill="#e8edfd"/>
  <text x="298" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d32c8">2</text>

  <rect x="198" y="122" width="136" height="46" rx="12" fill="#f0f1fa"/>
  <text x="210" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06112f">Investor deck</text>
  <circle cx="214" cy="154" r="4" fill="#0b43ed"/>
  <text x="223" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Anchor</text>

  <!-- mid-drag, lifted and tilted, crossing the gap -->
  <g transform="rotate(-3 250 74)" filter="url(#bdLift)">
    <rect x="186" y="52" width="140" height="46" rx="12" fill="#ffffff"/>
    <rect x="186.5" y="52.5" width="139" height="45" rx="11.5" fill="none" stroke="#0b43ed"/>
    <text x="198" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06112f">Home page — hero</text>
    <circle cx="202" cy="84" r="4" fill="#0b43ed"/>
    <text x="211" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Anchor</text>
  </g>
</svg>
