<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Board columns named after the studio's own statuses, with a card being dragged between them">
  <!-- The app's real card recipe: rounded-2xl (16px) + border-border (#e5e7eb)
       + bg-surface + the soft `shadow-card`. Inner cards are rounded-xl (12px)
       on bg-background (#f0f1fa). Counts use the brand-soft pill. -->
  <defs>
    <filter id="bdCard" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06112f" flood-opacity="0.04"/>
    </filter>
    <filter id="bdLift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06112f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- column: In design -->
  <g filter="url(#bdCard)">
    <rect x="8" y="16" width="152" height="216" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="24" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06112f">In design</text>
  <rect x="96" y="31" width="22" height="15" rx="7.5" fill="#e8edfd"/>
  <text x="103" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d32c8">4</text>
  <rect x="22" y="56" width="124" height="42" rx="12" fill="#f0f1fa"/>
  <rect x="34" y="68" width="74" height="6" rx="3" fill="#06112f"/>
  <rect x="34" y="82" width="46" height="5" rx="2.5" fill="#98a0b3"/>
  <rect x="22" y="106" width="124" height="42" rx="12" fill="#f0f1fa"/>
  <rect x="34" y="118" width="90" height="6" rx="3" fill="#06112f"/>
  <rect x="34" y="132" width="40" height="5" rx="2.5" fill="#98a0b3"/>

  <!-- column: Client approval -->
  <g filter="url(#bdCard)">
    <rect x="176" y="16" width="152" height="216" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text x="192" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06112f">Client approval</text>
  <rect x="22" y="0" width="0" height="0"/>
  <rect x="190" y="106" width="124" height="42" rx="12" fill="#f0f1fa"/>
  <rect x="202" y="118" width="62" height="6" rx="3" fill="#06112f"/>
  <rect x="202" y="132" width="44" height="5" rx="2.5" fill="#98a0b3"/>

  <!-- the card mid-drag: lifted and tilted, carrying the brand ring -->
  <g transform="rotate(-3 244 78)" filter="url(#bdLift)">
    <rect x="182" y="56" width="128" height="46" rx="12" fill="#ffffff"/>
    <rect x="182.5" y="56.5" width="127" height="45" rx="11.5" fill="none" stroke="#0b43ed"/>
    <rect x="196" y="70" width="78" height="7" rx="3.5" fill="#06112f"/>
    <rect x="196" y="84" width="50" height="5" rx="2.5" fill="#98a0b3"/>
  </g>
</svg>
