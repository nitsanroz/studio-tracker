<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400" role="img" aria-label="An iPhone showing the task list with the new bar along the bottom">
  <defs>
    <clipPath id="barScreen"><rect x="12" y="12" width="176" height="376" rx="22"/></clipPath>
  </defs>
  <!-- No background: the panel behind this is the blue box. -->
  <!-- device -->
  <rect x="4" y="4" width="192" height="392" rx="30" fill="#06112f"/>
  <rect x="12" y="12" width="176" height="376" rx="22" fill="#f0f1fa"/>
  <g clip-path="url(#barScreen)">
    <!-- app header -->
    <rect x="12" y="12" width="176" height="40" fill="#ffffff"/>
    <text x="26" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#06112f">&amp;more</text>
    <circle cx="168" cy="32" r="9" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
    <path d="M164.5 33.5 a3.5 4 0 0 1 7 0 v1 h-7 z M166.5 36 a1.5 1.5 0 0 0 3 0" fill="none" stroke="#5c6478" stroke-width="1.1" stroke-linejoin="round"/>
    <!-- page title -->
    <text x="26" y="76" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#06112f">My Tasks</text>
    <!-- task cards -->
    <g>
      <rect x="24" y="90" width="152" height="46" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="34" y="101" width="82" height="7" rx="3.5" fill="#06112f"/>
      <rect x="34" y="117" width="44" height="5" rx="2.5" fill="#98a0b3"/>
      <text x="129" y="123" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <g>
      <rect x="24" y="144" width="152" height="46" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="34" y="155" width="98" height="7" rx="3.5" fill="#06112f"/>
      <rect x="34" y="171" width="52" height="5" rx="2.5" fill="#98a0b3"/>
      <text x="129" y="177" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <g>
      <rect x="24" y="198" width="152" height="46" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="34" y="209" width="70" height="7" rx="3.5" fill="#06112f"/>
      <rect x="34" y="225" width="44" height="5" rx="2.5" fill="#98a0b3"/>
      <text x="129" y="231" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <g>
      <rect x="24" y="252" width="152" height="46" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="34" y="263" width="88" height="7" rx="3.5" fill="#06112f"/>
      <rect x="34" y="279" width="38" height="5" rx="2.5" fill="#98a0b3"/>
      <text x="129" y="285" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <!-- bottom bar -->
    <rect x="12" y="336" width="176" height="52" fill="#0b43ed"/>
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- home -->
      <path d="M32 358 l7-6 7 6 v8 h-14 z" fill="none" stroke="#b9c8f9" stroke-width="1.9"/>
      <!-- tasks, active -->
      <rect x="62" y="352" width="14" height="14" rx="2.4" fill="none" stroke="#ffffff" stroke-width="1.9"/>
      <path d="M65.5 359 l2.8 2.8 4.6-5.4" fill="none" stroke="#ffffff" stroke-width="1.9"/>
      <!-- the + -->
      <circle cx="100" cy="359" r="14" fill="#ffffff"/>
      <path d="M100 352 v14 M93 359 h14" stroke="#0b43ed" stroke-width="2.6"/>
      <!-- inbox -->
      <path d="M124 353 h14 v12 h-14 z M124 361 h4.5 l1.5 2.2 h2 l1.5-2.2 h4.5" fill="none" stroke="#b9c8f9" stroke-width="1.8"/>
      <!-- menu -->
      <path d="M155 354 h14 M155 359 h14 M155 364 h14" stroke="#b9c8f9" stroke-width="1.9"/>
    </g>
  </g>
  <!-- dynamic island, drawn over the screen -->
  <rect x="82" y="20" width="36" height="10" rx="5" fill="#06112f"/>
</svg>
