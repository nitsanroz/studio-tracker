<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="300" height="190" role="img" aria-label="A phone showing the task list with the new bar along the bottom">
  <defs>
    <clipPath id="barScreen"><rect x="90" y="10" width="120" height="170" rx="12"/></clipPath>
  </defs>
  <rect width="300" height="190" fill="#f0f1fa"/>
  <!-- phone body -->
  <rect x="88" y="8" width="124" height="174" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <g clip-path="url(#barScreen)">
    <rect x="90" y="10" width="120" height="170" fill="#f0f1fa"/>
    <!-- header -->
    <rect x="90" y="10" width="120" height="20" fill="#ffffff"/>
    <text x="98" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#06112f">&amp;more</text>
    <!-- task cards -->
    <g>
      <rect x="97" y="38" width="106" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="103" y="44" width="52" height="5" rx="2.5" fill="#06112f"/>
      <rect x="103" y="55" width="30" height="4" rx="2" fill="#98a0b3"/>
      <text x="175" y="60" font-family="system-ui, sans-serif" font-size="6" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <g>
      <rect x="97" y="73" width="106" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="103" y="79" width="62" height="5" rx="2.5" fill="#06112f"/>
      <rect x="103" y="90" width="34" height="4" rx="2" fill="#98a0b3"/>
      <text x="175" y="95" font-family="system-ui, sans-serif" font-size="6" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <g>
      <rect x="97" y="108" width="106" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="103" y="114" width="45" height="5" rx="2.5" fill="#06112f"/>
      <rect x="103" y="125" width="30" height="4" rx="2" fill="#98a0b3"/>
      <text x="175" y="130" font-family="system-ui, sans-serif" font-size="6" font-weight="600" fill="#0b43ed">+ Time</text>
    </g>
    <!-- bottom bar -->
    <rect x="90" y="152" width="120" height="28" fill="#0b43ed"/>
    <!-- home -->
    <path d="M104 165 l5-4 5 4 v5 h-10 z" fill="none" stroke="#b9c8f9" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- tasks (active, full ink) -->
    <rect x="123" y="161" width="9" height="9" rx="1.6" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M125.4 165.6 l1.8 1.8 3.2-3.6" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the + -->
    <circle cx="150" cy="166" r="9" fill="#ffffff"/>
    <path d="M150 161.5 v9 M145.5 166 h9" stroke="#0b43ed" stroke-width="1.8" stroke-linecap="round"/>
    <!-- inbox -->
    <path d="M168 162 h9 v8 h-9 z M168 167 h3 l1 1.5 h1 l1-1.5 h3" fill="none" stroke="#b9c8f9" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- menu -->
    <path d="M188 163 h9 M188 166.5 h9 M188 170 h9" stroke="#b9c8f9" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
