<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="The Share plan button, the copied link, and the live plan a client opens">
  <!-- ⚠️ Everything sits inside 0..240. The first version drew the plan card to
       y=252 in a 240-tall viewBox, so the canvas itself cut it in half — which
       read as a broken crop rather than artwork.
       The icon is lucide's Link2 at its real geometry (24-unit grid, scaled),
       not a hand-drawn approximation: the app uses lucide throughout, and a
       freehand chain reads as a squiggle at this size. -->
  <defs>
    <filter id="shCard" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- the button, as it sits on the Timeline toolbar -->
  <g filter="url(#shCard)">
    <rect x="92" y="16" width="176" height="42" rx="12" fill="#ffffff"/>
  </g>
  <g transform="translate(114 27) scale(0.75)" fill="none" stroke="#0b43ed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
    <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
    <path d="M8 12h8"/>
  </g>
  <text x="148" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#06112f">Share plan</text>

  <!-- copied confirmation -->
  <g filter="url(#shCard)">
    <rect x="44" y="70" width="272" height="40" rx="12" fill="#ffffff"/>
  </g>
  <circle cx="68" cy="90" r="9" fill="#16a34a"/>
  <path d="M64.2 90 l2.8 2.8 5.2-5.6" stroke="#ffffff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="87" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06112f">Link copied</text>
  <text x="86" y="101" font-family="system-ui, sans-serif" font-size="9.5" fill="#98a0b3">tracker.studionmore.com/gantt/…</text>

  <!-- what the client opens: the live plan, dates only -->
  <g filter="url(#shCard)">
    <rect x="52" y="124" width="256" height="104" rx="12" fill="#ffffff"/>
  </g>
  <text x="66" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#06112f">Anchor · Schedule</text>
  <text x="252" y="145" font-family="system-ui, sans-serif" font-size="8.5" fill="#98a0b3">AUG</text>
  <path d="M52 152 h256" stroke="#e5e7eb"/>

  <text x="66" y="172" font-family="system-ui, sans-serif" font-size="9.5" fill="#06112f">Hero section</text>
  <rect x="150" y="162" width="96" height="14" rx="4" fill="#0b43ed" opacity="0.24"/>
  <rect x="150" y="162" width="58" height="14" rx="4" fill="#0b43ed"/>

  <text x="66" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#06112f">Wireframe</text>
  <rect x="176" y="188" width="112" height="14" rx="4" fill="#1d9e75" opacity="0.24"/>
  <rect x="176" y="188" width="46" height="14" rx="4" fill="#1d9e75"/>

  <text x="66" y="220" font-family="system-ui, sans-serif" font-size="8.5" fill="#98a0b3">Dates only — no hours, no assignees</text>
</svg>
