<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400" role="img" aria-label="An iPhone showing the log-time sheet: a task, a duration with quick 30m, 1h and 2h buttons, and a description">
  <defs>
    <clipPath id="sheetScreen"><rect x="12" y="12" width="176" height="376" rx="22"/></clipPath>
  </defs>
  <rect x="4" y="4" width="192" height="392" rx="30" fill="#06112f"/>
  <rect x="12" y="12" width="176" height="376" rx="22" fill="#f0f1fa"/>
  <g clip-path="url(#sheetScreen)">
    <!-- the page behind, then the scrim -->
    <rect x="12" y="12" width="176" height="40" fill="#ffffff"/>
    <text x="26" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#06112f">&amp;more</text>
    <rect x="24" y="70" width="152" height="42" rx="9" fill="#ffffff"/>
    <rect x="24" y="120" width="152" height="42" rx="9" fill="#ffffff"/>
    <rect x="12" y="12" width="176" height="376" fill="#06112f" opacity="0.4"/>

    <!-- the sheet -->
    <rect x="12" y="178" width="176" height="210" rx="18" fill="#ffffff"/>
    <rect x="91" y="190" width="18" height="4" rx="2" fill="#d1d5db"/>

    <text x="26" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">&#8592; Home page — hero</text>

    <!-- duration + quick chips -->
    <rect x="26" y="228" width="40" height="24" rx="5" fill="#ffffff" stroke="#0b43ed" stroke-width="1.4"/>
    <text x="35" y="244" font-family="system-ui, sans-serif" font-size="10" fill="#06112f">1.5h</text>
    <rect x="72" y="228" width="34" height="24" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="79" y="244" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">30m</text>
    <rect x="112" y="228" width="27" height="24" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="119" y="244" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">1h</text>
    <rect x="145" y="228" width="27" height="24" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="152" y="244" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">2h</text>

    <!-- description -->
    <rect x="26" y="262" width="146" height="42" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="34" y="279" font-family="system-ui, sans-serif" font-size="10" fill="#98a0b3">What did you do?</text>

    <!-- date -->
    <text x="26" y="322" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Today</text>

    <!-- submit -->
    <rect x="26" y="334" width="146" height="30" rx="7" fill="#06112f"/>
    <text x="76" y="354" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Add time</text>
  </g>
  <rect x="82" y="20" width="36" height="10" rx="5" fill="#06112f"/>
</svg>
