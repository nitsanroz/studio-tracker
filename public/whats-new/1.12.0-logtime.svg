<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="300" height="190" role="img" aria-label="The log-time sheet on a phone: a task, a duration with quick 30m, 1h and 2h buttons, and a description">
  <defs>
    <clipPath id="sheetScreen"><rect x="90" y="10" width="120" height="170" rx="12"/></clipPath>
  </defs>
  <rect width="300" height="190" fill="#f0f1fa"/>
  <rect x="88" y="8" width="124" height="174" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <g clip-path="url(#sheetScreen)">
    <rect x="90" y="10" width="120" height="170" fill="#f0f1fa"/>
    <!-- dimmed page behind the sheet -->
    <rect x="97" y="24" width="106" height="26" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="97" y="55" width="106" height="26" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="90" y="10" width="120" height="170" fill="#000000" opacity="0.35"/>
    <!-- the sheet -->
    <rect x="90" y="72" width="120" height="108" rx="10" fill="#ffffff"/>
    <rect x="143" y="79" width="14" height="2.5" rx="1.25" fill="#d1d5db"/>
    <!-- picked task -->
    <text x="99" y="94" font-family="system-ui, sans-serif" font-size="6" fill="#5c6478">&#8592; Home page — hero</text>
    <!-- duration + chips -->
    <rect x="99" y="100" width="24" height="13" rx="3" fill="#ffffff" stroke="#0b43ed"/>
    <text x="104" y="109" font-family="system-ui, sans-serif" font-size="6" fill="#06112f">1.5h</text>
    <rect x="127" y="100" width="21" height="13" rx="3" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="131" y="109" font-family="system-ui, sans-serif" font-size="6" fill="#5c6478">30m</text>
    <rect x="152" y="100" width="17" height="13" rx="3" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="157" y="109" font-family="system-ui, sans-serif" font-size="6" fill="#5c6478">1h</text>
    <rect x="173" y="100" width="17" height="13" rx="3" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="178" y="109" font-family="system-ui, sans-serif" font-size="6" fill="#5c6478">2h</text>
    <!-- description -->
    <rect x="99" y="119" width="91" height="20" rx="3" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="104" y="131" font-family="system-ui, sans-serif" font-size="6" fill="#98a0b3">What did you do?</text>
    <!-- submit -->
    <rect x="99" y="145" width="91" height="16" rx="4" fill="#06112f"/>
    <text x="130" y="156" font-family="system-ui, sans-serif" font-size="6.5" font-weight="600" fill="#ffffff">Add time</text>
  </g>
</svg>
