<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="A marquee dragged across the Timeline selecting three task bars at once">
  <!-- The MARQUEE, which is how a multi-selection is actually made: press empty
       calendar and drag a rectangle. ⚠️ It hit-tests the BAR, not the row — a
       box over these days takes the tasks that RUN in them, which is why the
       fourth bar is untouched despite the box crossing its row.
       Selected bars carry the brand ring INSIDE the bar at 1px; 2px was
       rejected in v1.11.0 as reading like a row of buttons.
       NOTE: never write a CSS custom property in an SVG comment — the two
       hyphens in its name are illegal inside an XML comment and silently kill
       the whole file (naturalWidth 0, alt text in place of the picture). -->
  <defs>
    <filter id="mdCard" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.10"/>
    </filter>
    <clipPath id="mdClip"><rect x="6" y="14" width="348" height="212" rx="16"/></clipPath>
  </defs>

  <g filter="url(#mdCard)">
    <rect x="6" y="14" width="348" height="212" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <g clip-path="url(#mdClip)">
    <rect x="6" y="14" width="348" height="34" fill="#ffffff"/>
    <text x="20" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#98a0b3" letter-spacing="0.6">TASK</text>
    <text x="132" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#06112f" letter-spacing="0.7">AUG</text>
    <g font-family="system-ui, sans-serif" font-size="10" fill="#98a0b3">
      <text x="184" y="36">13</text>
      <text x="228" y="36">14</text>
      <text x="272" y="36">15</text>
      <text x="316" y="36">16</text>
    </g>
    <rect x="6" y="47" width="348" height="1" fill="#e5e7eb"/>
    <g fill="#e5e7eb" opacity="0.7">
      <rect x="176" y="48" width="1" height="178"/>
      <rect x="220" y="48" width="1" height="178"/>
      <rect x="264" y="48" width="1" height="178"/>
      <rect x="308" y="48" width="1" height="178"/>
    </g>
    <rect x="128" y="48" width="1" height="178" fill="#06112f" opacity="0.18"/>

    <g font-family="system-ui, sans-serif" font-size="11" fill="#06112f">
      <text x="20" y="76">Home page — hero</text>
      <text x="20" y="120">Wireframe</text>
      <text x="20" y="164">Brand guidelines</text>
      <text x="20" y="208">LinkedIn banners</text>
    </g>

    <!-- three bars inside the box, each ringed -->
    <rect x="150" y="59" width="112" height="27" rx="4" fill="#0b43ed" opacity="0.24"/>
    <rect x="150" y="59" width="70" height="27" rx="4" fill="#0b43ed"/>
    <rect x="150.5" y="59.5" width="111" height="26" rx="3.5" fill="none" stroke="#0b43ed"/>
    <text x="158" y="77" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Hero section</text>

    <rect x="178" y="103" width="118" height="27" rx="4" fill="#1d9e75" opacity="0.24"/>
    <rect x="178" y="103" width="54" height="27" rx="4" fill="#1d9e75"/>
    <rect x="178.5" y="103.5" width="117" height="26" rx="3.5" fill="none" stroke="#0b43ed"/>
    <text x="186" y="121" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Wireframe</text>

    <rect x="160" y="147" width="96" height="27" rx="4" fill="#d4537e" opacity="0.24"/>
    <rect x="160" y="147" width="74" height="27" rx="4" fill="#d4537e"/>
    <rect x="160.5" y="147.5" width="95" height="26" rx="3.5" fill="none" stroke="#0b43ed"/>
    <text x="168" y="165" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Guidelines</text>

    <!-- outside the box: crosses the row, but its BAR doesn't overlap -->
    <rect x="308" y="191" width="44" height="27" rx="4" fill="#ba7517" opacity="0.24"/>
    <rect x="308" y="191" width="22" height="27" rx="4" fill="#ba7517"/>
    <text x="316" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">QA</text>

    <!-- the marquee itself -->
    <rect x="140" y="54" width="164" height="146" rx="3" fill="#0b43ed" opacity="0.10"/>
    <rect x="140.5" y="54.5" width="163" height="145" rx="3" fill="none" stroke="#0b43ed" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- cursor at the dragging corner -->
    <g transform="translate(298 192)">
      <path d="M0 0 L0 17 L4.4 12.8 L7.2 18.6 L10.4 17.1 L7.6 11.4 L13.6 11.2 Z" fill="#ffffff" stroke="#06112f" stroke-width="1.2" stroke-linejoin="round"/>
    </g>

    <!-- the count the app shows for a selection -->
    <rect x="140" y="206" width="94" height="22" rx="6" fill="#06112f"/>
    <text x="150" y="221" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">3 selected</text>
  </g>
</svg>
