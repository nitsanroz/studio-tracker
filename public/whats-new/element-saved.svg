<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="A task's budget being edited to 24 hours, keeping the new value instead of reverting">
  <!-- Real labels and values rather than grey rules — "Budget 24 h" is the
       whole point, and a placeholder bar can't be seen to have changed. The row
       is the task pane's own shape: label left at 13px muted, value at
       foreground, on the app's card. -->
  <defs>
    <filter id="svCard" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g filter="url(#svCard)">
    <rect x="14" y="46" width="332" height="150" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <text x="34" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06112f">Home page — hero</text>

  <text x="34" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#5c6478">Assignee</text>
  <text x="150" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#06112f">Nadav</text>

  <text x="34" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#5c6478">Dates</text>
  <text x="150" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#06112f">12/8 – 18/8</text>

  <!-- the field being edited, holding the value you typed -->
  <text x="34" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#5c6478">Budget</text>
  <rect x="146" y="154" width="86" height="30" rx="7" fill="#ffffff" stroke="#0b43ed" stroke-width="1.5"/>
  <text x="160" y="174" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#06112f">24 h</text>
  <rect x="203" y="161" width="1.6" height="16" rx="0.8" fill="#0b43ed"/>

  <!-- what a refresh used to put back, struck through -->
  <text x="248" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#98a0b3">16 h</text>
  <path d="M245 170 h30" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round"/>

  <!-- saved -->
  <g>
    <rect x="118" y="206" width="124" height="28" rx="14" fill="#ffffff"/>
    <rect x="118.5" y="206.5" width="123" height="27" rx="13.5" fill="none" stroke="#e5e7eb"/>
    <circle cx="140" cy="220" r="8" fill="#16a34a"/>
    <path d="M136.4 220 l2.6 2.6 5-5.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="156" y="224" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#06112f">Saved</text>
  </g>
</svg>
