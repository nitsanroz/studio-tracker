<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="A field being edited, with the value staying put and marked saved">
  <defs>
    <filter id="svShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#06112f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- the row being edited -->
  <g filter="url(#svShadow)">
    <rect x="24" y="76" width="312" height="60" rx="14" fill="#ffffff"/>
    <text x="46" y="104" font-family="system-ui, sans-serif" font-size="11" fill="#98a0b3">Budget</text>
    <rect x="46" y="110" width="150" height="12" rx="6" fill="#f0f1fa"/>
    <!-- the focused field, holding its value -->
    <rect x="218" y="90" width="96" height="32" rx="8" fill="#ffffff" stroke="#0b43ed" stroke-width="2"/>
    <text x="236" y="112" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#06112f">24 h</text>
    <rect x="290" y="97" width="1.6" height="18" rx="0.8" fill="#0b43ed"/>
  </g>

  <!-- saved confirmation -->
  <g filter="url(#svShadow)">
    <rect x="118" y="154" width="124" height="34" rx="17" fill="#ffffff"/>
    <circle cx="142" cy="171" r="9" fill="#1d9e75"/>
    <path d="M138 171 l3 3 5.5-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#06112f">Saved</text>
  </g>

  <!-- the old behaviour, struck through: a stale value creeping back -->
  <g opacity="0.4">
    <rect x="218" y="34" width="96" height="30" rx="8" fill="#ffffff"/>
    <text x="238" y="54" font-family="system-ui, sans-serif" font-size="14" fill="#98a0b3">16 h</text>
    <path d="M228 49 h76" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <path d="M266 68 v10 M260 72 l6 6 6-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
