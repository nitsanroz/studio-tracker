<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="A milestone named Client review on the Timeline, its line running down past the task bars">
  <!-- ⚠️ The Timeline sits on its own WHITE CARD. Floating the rows straight on
       the blue lost the grid, the pinned task column and the ruler — everything
       that says "this is the Timeline" rather than "these are some bars".
       Values are the real ones: card `rounded-2xl` + `border-border` +
       `shadow-card`; bars 27h at radius 4 (BAR_H / BAR_R); the mark's line 2px
       brand at 50% UNDER the bars, its label a white pill with a brand border,
       no left edge, flush to the line (MarkLayer). -->
  <defs>
    <filter id="msCard" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.10"/>
    </filter>
    <clipPath id="msClip"><rect x="6" y="14" width="348" height="212" rx="16"/></clipPath>
  </defs>

  <g filter="url(#msCard)">
    <rect x="6" y="14" width="348" height="212" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <g clip-path="url(#msClip)">
    <!-- header: pinned column label + the tick row -->
    <rect x="6" y="14" width="348" height="34" fill="#ffffff"/>
    <text x="20" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#98a0b3" letter-spacing="0.6">TASK</text>
    <text x="132" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#06112f" letter-spacing="0.7">AUG</text>
    <g font-family="system-ui, sans-serif" font-size="10" fill="#98a0b3">
      <text x="184" y="36">13</text>
      <text x="228" y="36">14</text>
      <text x="272" y="36">15</text>
      <text x="316" y="36">16</text>
    </g>
    <rect x="6" y="47" width="348" height="1" fill="#e5e7eb"/>

    <!-- day grid -->
    <g fill="#e5e7eb" opacity="0.7">
      <rect x="176" y="48" width="1" height="178"/>
      <rect x="220" y="48" width="1" height="178"/>
      <rect x="264" y="48" width="1" height="178"/>
      <rect x="308" y="48" width="1" height="178"/>
    </g>
    <!-- month rule, the heavier weight -->
    <rect x="128" y="48" width="1" height="178" fill="#06112f" opacity="0.18"/>

    <!-- the mark's line: under the bars -->
    <rect x="230" y="48" width="2" height="178" fill="#0b43ed" opacity="0.5"/>

    <!-- rows: name pinned left, bar on the calendar -->
    <g font-family="system-ui, sans-serif" font-size="11" fill="#06112f">
      <text x="20" y="76">Home page — hero</text>
      <text x="20" y="120">Wireframe</text>
      <text x="20" y="164">Brand guidelines</text>
      <text x="20" y="208">LinkedIn banners</text>
    </g>

    <rect x="134" y="59" width="112" height="27" rx="4" fill="#0b43ed" opacity="0.24"/>
    <rect x="134" y="59" width="70" height="27" rx="4" fill="#0b43ed"/>
    <text x="142" y="77" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Hero section</text>

    <rect x="178" y="103" width="130" height="27" rx="4" fill="#1d9e75" opacity="0.24"/>
    <rect x="178" y="103" width="54" height="27" rx="4" fill="#1d9e75"/>
    <text x="186" y="121" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Wireframe</text>

    <rect x="150" y="147" width="96" height="27" rx="4" fill="#d4537e" opacity="0.24"/>
    <rect x="150" y="147" width="74" height="27" rx="4" fill="#d4537e"/>
    <text x="158" y="165" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Guidelines</text>

    <rect x="244" y="191" width="104" height="27" rx="4" fill="#ba7517" opacity="0.24"/>
    <rect x="244" y="191" width="46" height="27" rx="4" fill="#ba7517"/>
    <text x="252" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Banners</text>

    <!-- the label, above everything -->
    <path d="M232 52 h84 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-84 z" fill="#ffffff"/>
    <path d="M232 52 h84 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-84" fill="none" stroke="#0b43ed"/>
    <text x="239" y="67" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d32c8">Client review</text>
  </g>
</svg>
