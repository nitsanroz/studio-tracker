<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="A task row showing its Status pill and its separate Type chip">
  <!-- Authentic to the components: `TagBadge` is a fully-round pill filled with
       the status colour at `22` alpha (13%) with the same hue as its ink, and a
       task Type is the coloured dot the Timeline draws its bars from. The row is
       the app's card recipe — rounded-2xl, border-border, soft shadow-card. -->
  <defs>
    <filter id="stCard" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06112f" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- the column headers, so the rename is the point -->
  <g font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#98a0b3" letter-spacing="0.6">
    <text x="30" y="40">TASK</text>
    <text x="196" y="40">STATUS</text>
    <text x="288" y="40">TYPE</text>
  </g>

  <g filter="url(#stCard)">
    <rect x="16" y="54" width="328" height="60" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <rect x="30" y="76" width="120" height="7" rx="3.5" fill="#06112f"/>
  <rect x="30" y="92" width="66" height="5" rx="2.5" fill="#98a0b3"/>
  <!-- status pill: brand at 13% with brand-dark ink -->
  <rect x="192" y="74" width="80" height="22" rx="11" fill="#0b43ed" opacity="0.13"/>
  <text x="203" y="89" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d32c8">In design</text>
  <!-- type: the colour the Timeline bar is drawn from -->
  <circle cx="294" cy="85" r="5" fill="#1d9e75"/>
  <text x="304" y="89" font-family="system-ui, sans-serif" font-size="11" fill="#5c6478">Design</text>

  <g filter="url(#stCard)">
    <rect x="16" y="126" width="328" height="60" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <rect x="30" y="148" width="96" height="7" rx="3.5" fill="#06112f"/>
  <rect x="30" y="164" width="54" height="5" rx="2.5" fill="#98a0b3"/>
  <rect x="192" y="146" width="102" height="22" rx="11" fill="#d97706" opacity="0.13"/>
  <text x="203" y="161" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#d97706">Client approval</text>
  <circle cx="316" cy="157" r="5" fill="#d4537e"/>
  <text x="326" y="161" font-family="system-ui, sans-serif" font-size="11" fill="#5c6478">QA</text>
</svg>
