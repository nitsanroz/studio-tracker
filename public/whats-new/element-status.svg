<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Two task rows showing the Status pill and the separate Type beside it">
  <!-- Real task and client names rather than grey rules: the point is that the
       COLUMN is called Status now and that Type is a second, different thing —
       neither reads off placeholder bars. `TagBadge` is a fully-round pill
       filled with its colour at `22` alpha (13%), ink in the same hue. -->
  <defs>
    <filter id="stCard" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#06112f" flood-opacity="0.10"/>
    </filter>
    <clipPath id="stClip"><rect x="6" y="26" width="348" height="188" rx="16"/></clipPath>
  </defs>

  <g filter="url(#stCard)">
    <rect x="6" y="26" width="348" height="188" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  </g>

  <g clip-path="url(#stClip)">
    <!-- header, where the rename actually shows -->
    <rect x="6" y="26" width="348" height="34" fill="#f0f1fa"/>
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#98a0b3" letter-spacing="0.6">
      <text x="22" y="48">TASK</text>
      <text x="168" y="48">STATUS</text>
      <text x="268" y="48">TYPE</text>
    </g>
    <rect x="6" y="59" width="348" height="1" fill="#e5e7eb"/>

    <text x="22" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#06112f">Home page — hero</text>
    <text x="22" y="101" font-family="system-ui, sans-serif" font-size="10" fill="#98a0b3">Anchor</text>
    <rect x="164" y="80" width="72" height="21" rx="10.5" fill="#0b43ed" opacity="0.13"/>
    <text x="174" y="94" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1d32c8">In design</text>
    <circle cx="272" cy="90" r="4.5" fill="#1d9e75"/>
    <text x="282" y="94" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Design</text>
    <rect x="6" y="116" width="348" height="1" fill="#e5e7eb"/>

    <text x="22" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#06112f">Brand guidelines</text>
    <text x="22" y="157" font-family="system-ui, sans-serif" font-size="10" fill="#98a0b3">Checkmarx</text>
    <rect x="164" y="136" width="94" height="21" rx="10.5" fill="#d97706" opacity="0.13"/>
    <text x="174" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d97706">Client approval</text>
    <circle cx="272" cy="146" r="4.5" fill="#d4537e"/>
    <text x="282" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Content</text>
    <rect x="6" y="172" width="348" height="1" fill="#e5e7eb"/>

    <text x="22" y="198" font-family="system-ui, sans-serif" font-size="11" fill="#06112f">LinkedIn banners</text>
    <rect x="164" y="192" width="66" height="21" rx="10.5" fill="#16a34a" opacity="0.13"/>
    <text x="174" y="206" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16a34a">Approved</text>
    <circle cx="272" cy="202" r="4.5" fill="#ba7517"/>
    <text x="282" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#5c6478">Image making</text>
  </g>
</svg>
